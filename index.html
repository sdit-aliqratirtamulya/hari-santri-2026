<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Lomba Hari Santri 2026</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone untuk membaca JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-emerald-50/50 min-h-screen font-sans text-slate-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // =========================================================================
    // ⚠️ MASUKKAN URL GOOGLE APPS SCRIPT (GAS) ANDA DI SINI
    // =========================================================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzJ3PyQE4y5-LnsIlznitdAH4vfV-XbakCRpq7k6aJ5F8OCjKkOIknsTmarn5Gvdma8/exec";

    // Data Cabang Lomba Hari Santri 2026
    const LOMBA_DATA = [
      {
        kode: 'LMK',
        nama: 'Mewarnai Kaligrafi',
        kategoriRaw: 'Kelas 1A, 1B, 2A, 2B',
        allowedClasses: ['1A', '1B', '2A', '2B'],
        isKelompok: false,
        deskripsi: 'Lomba mewarnai seni kaligrafi tingkat dasar.',
        icon: 'palette'
      },
      {
        kode: 'LKG',
        nama: 'Kaligrafi',
        kategoriRaw: 'Kelas 3A - 6B',
        allowedClasses: ['3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: false,
        deskripsi: 'Menulis indah mushaf/kaligrafi Arab tingkat lanjutan.',
        icon: 'pen-tool'
      },
      {
        kode: 'LHQ',
        nama: 'Tahfizh',
        kategoriRaw: 'Kelas 1A - 6B',
        allowedClasses: ['1A', '1B', '2A', '2B', '3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: false,
        deskripsi: 'Uji hafalan Al-Qur\'an sesuai tingkat kelas.',
        icon: 'book-open'
      },
      {
        kode: 'LAZ',
        nama: 'Adzan & Iqomah',
        kategoriRaw: 'Kelas 1A - 6B',
        allowedClasses: ['1A', '1B', '2A', '2B', '3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: false,
        deskripsi: 'Melafalkan adzan dan iqomah dengan makhraj dan nada yang indah.',
        icon: 'mic'
      },
      {
        kode: 'LTQ',
        nama: 'Tilawatil Qur\'an',
        kategoriRaw: 'Kelas 3A - 6B',
        allowedClasses: ['3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: false,
        deskripsi: 'Membaca Al-Qur\'an dengan lagu/naghom & tajwid.',
        icon: 'award'
      },
      {
        kode: 'LPD',
        nama: 'Pidato',
        kategoriRaw: 'Kelas 3A - 6B',
        allowedClasses: ['3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: false,
        deskripsi: 'Lomba ceramah/pidato bahasa Indonesia bertema keislaman/santri.',
        icon: 'megaphone'
      },
      {
        kode: 'LSJ',
        nama: 'Sholat Berjama\'ah',
        kategoriRaw: 'Kelas 3A - 6B',
        allowedClasses: ['3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: true,
        anggotaLabels: ['Imam (Ketua)', 'Makmum 1 (Anggota)', 'Makmum 2 (Anggota)'],
        deskripsi: 'Praktik sholat berjama\'ah 3 orang (bacaan keras, gerakan, kekhusyu\'an).',
        icon: 'users'
      },
      {
        kode: 'LCC',
        nama: 'Cerdas Cermat',
        kategoriRaw: 'Kelas 3A - 6B',
        allowedClasses: ['3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'],
        isKelompok: true,
        anggotaLabels: ['Ketua Regu', 'Anggota 1', 'Anggota 2'],
        deskripsi: 'Kompetisi pengetahuan agama & umum beregu (3 santri per tim).',
        icon: 'brain'
      }
    ];

    const ALL_CLASSES = ['1A', '1B', '2A', '2B', '3A', '3B', '4A', '4B', '5A', '5B', '6A', '6B'];

    function App() {
      const [activeTab, setActiveTab] = useState('register');
      const [pendaftarList, setPendaftarList] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [selectedCard, setSelectedCard] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterLomba, setFilterLomba] = useState('ALL');
      const [apiStatus, setApiStatus] = useState({ type: '', msg: '' });

      const [formData, setFormData] = useState({
        kodeLomba: '',
        kelas: '',
        namaPeserta: '',
        anggota2: '',
        anggota3: ''
      });

      const selectedLomba = LOMBA_DATA.find(l => l.kode === formData.kodeLomba);

      // Fetch data dari Google Sheets API
      const fetchPendaftar = async () => {
        if (!GAS_API_URL || GAS_API_URL.includes("YOUR_DEPLOYMENT_ID_HERE")) {
          setApiStatus({
            type: 'warning',
            msg: 'URL Google Apps Script belum dikonfigurasi. Menggunakan mode Demo LocalStorage.'
          });
          const local = localStorage.getItem('santri_pendaftaran_2026');
          if (local) setPendaftarList(JSON.parse(local));
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(GAS_API_URL);
          const json = await res.json();
          if (json.success) {
            setPendaftarList(json.data || []);
            localStorage.setItem('santri_pendaftaran_2026', JSON.stringify(json.data || []));
          } else {
            console.error("GAS Error:", json.error);
          }
        } catch (err) {
          console.error("Gagal mengambil data dari Google Sheets:", err);
          const local = localStorage.getItem('santri_pendaftaran_2026');
          if (local) setPendaftarList(JSON.parse(local));
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchPendaftar();
      }, []);

      const handleChangeLomba = (e) => {
        const kode = e.target.value;
        const lomba = LOMBA_DATA.find(l => l.kode === kode);
        
        let newKelas = formData.kelas;
        if (lomba && !lomba.allowedClasses.includes(formData.kelas)) {
          newKelas = '';
        }

        setFormData({
          ...formData,
          kodeLomba: kode,
          kelas: newKelas,
          anggota2: '',
          anggota3: ''
        });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.kodeLomba || !formData.kelas || !formData.namaPeserta) {
          alert('Mohon lengkapi seluruh field utama!');
          return;
        }

        if (selectedLomba?.isKelompok && (!formData.anggota2 || !formData.anggota3)) {
          alert('Mohon lengkapi nama seluruh 3 anggota tim/regu!');
          return;
        }

        const payload = {
          kodeLomba: formData.kodeLomba,
          namaLomba: selectedLomba.nama,
          kelas: formData.kelas,
          isKelompok: !!selectedLomba.isKelompok,
          namaPeserta: formData.namaPeserta,
          anggota2: formData.anggota2 || '-',
          anggota3: formData.anggota3 || '-'
        };

        setIsSubmitting(true);

        // Jika API URL diset
        if (GAS_API_URL && !GAS_API_URL.includes("YOUR_DEPLOYMENT_ID_HERE")) {
          try {
            const response = await fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'create', data: payload })
            });
            const result = await response.json();
            if (result.success) {
              alert('🎉 Pendaftaran Berhasil Disimpan ke Google Sheets!');
              setFormData({ kodeLomba: '', kelas: '', namaPeserta: '', anggota2: '', anggota3: '' });
              fetchPendaftar();
              setActiveTab('data');
            } else {
              alert('Gagal menyimpan: ' + result.error);
            }
          } catch (err) {
            alert('Terjadi kesalahan koneksi ke Google Sheets. Menyimpan secara lokal.');
            saveLocal(payload);
          } finally {
            setIsSubmitting(false);
          }
        } else {
          // Fallback Local Storage
          saveLocal(payload);
          setIsSubmitting(false);
        }
      };

      const saveLocal = (payload) => {
        const newItem = {
          id: 'REG-' + Date.now().toString().slice(-6),
          timestamp: new Date().toISOString(),
          ...payload
        };
        const updated = [newItem, ...pendaftarList];
        setPendaftarList(updated);
        localStorage.setItem('santri_pendaftaran_2026', JSON.stringify(updated));
        alert('🎉 Pendaftaran Berhasil! (Tersimpan di Penyimpanan Lokal)');
        setFormData({ kodeLomba: '', kelas: '', namaPeserta: '', anggota2: '', anggota3: '' });
        setActiveTab('data');
      };

      const handleDelete = async (id) => {
        if (!confirm('Apakah Anda yakin ingin menghapus data pendaftaran ini?')) return;

        if (GAS_API_URL && !GAS_API_URL.includes("YOUR_DEPLOYMENT_ID_HERE")) {
          try {
            setIsLoading(true);
            await fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'delete', id: id })
            });
            fetchPendaftar();
          } catch (err) {
            alert('Gagal menghapus dari cloud: ' + err.message);
          } finally {
            setIsLoading(false);
          }
        } else {
          const updated = pendaftarList.filter(item => item.id !== id);
          setPendaftarList(updated);
          localStorage.setItem('santri_pendaftaran_2026', JSON.stringify(updated));
        }
      };

      const filteredList = pendaftarList.filter(item => {
        const matchesLomba = filterLomba === 'ALL' || item.kodeLomba === filterLomba;
        const matchesSearch = 
          item.namaPeserta.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (item.anggota2 && item.anggota2.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (item.anggota3 && item.anggota3.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesLomba && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-emerald-800 text-white shadow-lg border-b-4 border-amber-400 no-print">
            <div className="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3 text-center md:text-left">
                <div className="bg-emerald-700 p-3 rounded-2xl border border-emerald-600 shadow-inner">
                  <span className="text-3xl">🕌</span>
                </div>
                <div>
                  <h1 className="text-2xl md:text-3xl font-bold tracking-tight text-amber-300">
                    Lomba Hari Santri 2026
                  </h1>
                  <p className="text-emerald-100 text-sm font-medium">
                    Sistem Pendaftaran Resmi & Database Peserta
                  </p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex bg-emerald-900/60 p-1.5 rounded-xl border border-emerald-700/50">
                <button
                  onClick={() => setActiveTab('register')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'register'
                      ? 'bg-amber-400 text-emerald-950 font-bold shadow'
                      : 'text-emerald-100 hover:text-white hover:bg-emerald-800/50'
                  }`}
                >
                  📝 Form Pendaftaran
                </button>
                <button
                  onClick={() => setActiveTab('data')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all relative ${
                    activeTab === 'data'
                      ? 'bg-amber-400 text-emerald-950 font-bold shadow'
                      : 'text-emerald-100 hover:text-white hover:bg-emerald-800/50'
                  }`}
                >
                  📋 Data Peserta
                  {pendaftarList.length > 0 && (
                    <span className="ml-2 bg-emerald-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">
                      {pendaftarList.length}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => setActiveTab('katalog')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === 'katalog'
                      ? 'bg-amber-400 text-emerald-950 font-bold shadow'
                      : 'text-emerald-100 hover:text-white hover:bg-emerald-800/50'
                  }`}
                >
                  🏆 Cabang Lomba
                </button>
              </nav>
            </div>
          </header>

          {/* Alert Status Banner */}
          {apiStatus.msg && (
            <div className="bg-amber-100 border-b border-amber-300 text-amber-900 px-4 py-2 text-xs text-center font-medium no-print">
              ⚠️ {apiStatus.msg}
            </div>
          )}

          {/* Main Content Container */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">

            {/* TAB 1: FORM PENDAFTARAN */}
            {activeTab === 'register' && (
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl border border-emerald-100 overflow-hidden">
                  <div className="bg-gradient-to-r from-emerald-700 to-teal-800 px-6 py-5 text-white">
                    <h2 className="text-xl font-bold flex items-center gap-2">
                      <span>📌</span> Formulir Pendaftaran Peserta
                    </h2>
                    <p className="text-emerald-100 text-xs mt-1">
                      Silakan isi data calon peserta dengan benar sesuai kriteria kelas lomba.
                    </p>
                  </div>

                  <form onSubmit={handleSubmit} className="p-6 md:p-8 space-y-6">
                    {/* Choose Lomba */}
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">
                        Pilih Cabang Lomba <span className="text-red-500">*</span>
                      </label>
                      <select
                        value={formData.kodeLomba}
                        onChange={handleChangeLomba}
                        required
                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-white font-medium text-slate-800 shadow-sm transition"
                      >
                        <option value="">-- Pilih Mata Lomba --</option>
                        {LOMBA_DATA.map(lomba => (
                          <option key={lomba.kode} value={lomba.kode}>
                            [{lomba.kode}] {lomba.nama} ({lomba.kategoriRaw}) {lomba.isKelompok ? '👥 Berkelompok' : '👤 Individu'}
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* Selected Lomba Badge Info */}
                    {selectedLomba && (
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-xs text-emerald-900 space-y-1">
                        <div className="font-bold text-emerald-800 text-sm flex items-center justify-between">
                          <span>{selectedLomba.nama} ({selectedLomba.kode})</span>
                          <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold ${selectedLomba.isKelompok ? 'bg-amber-200 text-amber-900' : 'bg-blue-200 text-blue-900'}`}>
                            {selectedLomba.isKelompok ? 'Lomba Berkelompok (3 Orang)' : 'Lomba Perorangan / Individu'}
                          </span>
                        </div>
                        <p>{selectedLomba.deskripsi}</p>
                        <p className="font-semibold text-emerald-700">Kategori Kelas Diizinkan: {selectedLomba.kategoriRaw}</p>
                      </div>
                    )}

                    {/* Choose Kelas */}
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">
                        Kategori Kelas <span className="text-red-500">*</span>
                      </label>
                      <select
                        value={formData.kelas}
                        onChange={(e) => setFormData({ ...formData, kelas: e.target.value })}
                        required
                        disabled={!formData.kodeLomba}
                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-white font-medium text-slate-800 disabled:bg-slate-100 disabled:cursor-not-allowed shadow-sm transition"
                      >
                        <option value="">
                          {!formData.kodeLomba ? '-- Pilih Lomba Terlebih Dahulu --' : '-- Pilih Kelas Peserta --'}
                        </option>
                        {selectedLomba
                          ? selectedLomba.allowedClasses.map(k => (
                              <option key={k} value={k}>Kelas {k}</option>
                            ))
                          : ALL_CLASSES.map(k => (
                              <option key={k} value={k}>Kelas {k}</option>
                            ))
                        }
                      </select>
                    </div>

                    {/* Nama Peserta / Tim */}
                    {!selectedLomba?.isKelompok ? (
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-2">
                          Nama Lengkap Peserta <span className="text-red-500">*</span>
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="Masukkan nama lengkap santri..."
                          value={formData.namaPeserta}
                          onChange={(e) => setFormData({ ...formData, namaPeserta: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 font-medium text-slate-800 shadow-sm transition"
                        />
                      </div>
                    ) : (
                      <div className="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div className="font-bold text-slate-700 text-sm flex items-center justify-between border-b pb-2 border-slate-200">
                          <span>👥 Anggota Tim / Regu (Wajib 3 Peserta)</span>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">
                            1. {selectedLomba.anggotaLabels?.[0] || 'Ketua Tim / Anggota 1'} <span className="text-red-500">*</span>
                          </label>
                          <input
                            type="text"
                            required
                            placeholder="Nama Lengkap Ketua / Imam..."
                            value={formData.namaPeserta}
                            onChange={(e) => setFormData({ ...formData, namaPeserta: e.target.value })}
                            className="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 bg-white font-medium text-slate-800 text-sm"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">
                            2. {selectedLomba.anggotaLabels?.[1] || 'Anggota 2'} <span className="text-red-500">*</span>
                          </label>
                          <input
                            type="text"
                            required
                            placeholder="Nama Lengkap Makmum 1 / Anggota 2..."
                            value={formData.anggota2}
                            onChange={(e) => setFormData({ ...formData, anggota2: e.target.value })}
                            className="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 bg-white font-medium text-slate-800 text-sm"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">
                            3. {selectedLomba.anggotaLabels?.[2] || 'Anggota 3'} <span className="text-red-500">*</span>
                          </label>
                          <input
                            type="text"
                            required
                            placeholder="Nama Lengkap Makmum 2 / Anggota 3..."
                            value={formData.anggota3}
                            onChange={(e) => setFormData({ ...formData, anggota3: e.target.value })}
                            className="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 bg-white font-medium text-slate-800 text-sm"
                          />
                        </div>
                      </div>
                    )}

                    {/* Submit Button */}
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-lg hover:shadow-emerald-600/30 transition-all duration-200 flex items-center justify-center gap-2 text-base disabled:opacity-50"
                    >
                      {isSubmitting ? (
                        <>
                          <svg className="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                          </svg>
                          <span>Menyimpan Ke Spreadsheet...</span>
                        </>
                      ) : (
                        <>
                          <span>Kirim Pendaftaran</span>
                          <span>➔</span>
                        </>
                      )}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* TAB 2: DATA PESERTA & REKAPITULASI */}
            {activeTab === 'data' && (
              <div className="space-y-6">
                {/* Stats Header */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-100">
                    <p className="text-xs font-semibold text-slate-500">Total Pendaftar</p>
                    <p className="text-2xl font-black text-emerald-800">{pendaftarList.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-100">
                    <p className="text-xs font-semibold text-slate-500">Lomba Perorangan</p>
                    <p className="text-2xl font-black text-blue-700">
                      {pendaftarList.filter(i => !i.isKelompok).length}
                    </p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-100">
                    <p className="text-xs font-semibold text-slate-500">Lomba Kelompok (Tim)</p>
                    <p className="text-2xl font-black text-amber-700">
                      {pendaftarList.filter(i => i.isKelompok).length}
                    </p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-100">
                    <p className="text-xs font-semibold text-slate-500">Cabang Terfavorit</p>
                    <p className="text-sm font-bold text-slate-800 truncate">
                      {pendaftarList.length === 0 ? '-' : (() => {
                        const counts = {};
                        pendaftarList.forEach(i => counts[i.kodeLomba] = (counts[i.kodeLomba] || 0) + 1);
                        const top = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, '');
                        return LOMBA_DATA.find(l => l.kode === top)?.nama || '-';
                      })()}
                    </p>
                  </div>
                </div>

                {/* Filter and Search Bar */}
                <div className="bg-white p-4 rounded-xl shadow-sm border border-emerald-100 flex flex-col md:flex-row gap-3 justify-between items-center">
                  <div className="w-full md:w-auto flex-1 flex flex-col md:flex-row gap-3">
                    <input
                      type="text"
                      placeholder="🔍 Cari nama peserta atau No. Reg..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="px-4 py-2 border rounded-lg text-sm w-full md:w-64 focus:ring-2 focus:ring-emerald-500"
                    />
                    <select
                      value={filterLomba}
                      onChange={(e) => setFilterLomba(e.target.value)}
                      className="px-4 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500"
                    >
                      <option value="ALL">Semua Cabang Lomba</option>
                      {LOMBA_DATA.map(l => (
                        <option key={l.kode} value={l.kode}>[{l.kode}] {l.nama}</option>
                      ))}
                    </select>
                  </div>

                  <button
                    onClick={fetchPendaftar}
                    disabled={isLoading}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg flex items-center gap-2 border shadow-sm"
                  >
                    🔄 {isLoading ? 'Memuat Data...' : 'Refresh Data'}
                  </button>
                </div>

                {/* Data Table */}
                <div className="bg-white rounded-2xl shadow-md border border-emerald-100 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-700">
                      <thead className="bg-emerald-800 text-white text-xs uppercase tracking-wider">
                        <tr>
                          <th className="px-4 py-3">No. Reg</th>
                          <th className="px-4 py-3">Cabang Lomba</th>
                          <th className="px-4 py-3">Kelas</th>
                          <th className="px-4 py-3">Peserta / Anggota Regu</th>
                          <th className="px-4 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {isLoading ? (
                          <tr>
                            <td colSpan="5" className="px-6 py-12 text-center text-slate-500">
                              <div className="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
                              <p className="mt-2 text-xs font-semibold">Mengambil data pendaftar...</p>
                            </td>
                          </tr>
                        ) : filteredList.length === 0 ? (
                          <tr>
                            <td colSpan="5" className="px-6 py-12 text-center text-slate-400">
                              Tidak ada data pendaftaran yang ditemukan.
                            </td>
                          </tr>
                        ) : (
                          filteredList.map((item) => (
                            <tr key={item.id} className="hover:bg-emerald-50/50 transition">
                              <td className="px-4 py-3 font-mono font-bold text-emerald-900 text-xs">
                                {item.id}
                              </td>
                              <td className="px-4 py-3">
                                <span className="font-semibold block">{item.namaLomba}</span>
                                <span className="text-[10px] text-slate-400 font-mono">[{item.kodeLomba}]</span>
                              </td>
                              <td className="px-4 py-3">
                                <span className="bg-slate-100 px-2.5 py-1 rounded-md text-xs font-bold text-slate-700 border">
                                  Kelas {item.kelas}
                                </span>
                              </td>
                              <td className="px-4 py-3">
                                {!item.isKelompok ? (
                                  <span className="font-bold text-slate-800">{item.namaPeserta}</span>
                                ) : (
                                  <div className="space-y-0.5 text-xs">
                                    <div className="font-bold text-emerald-800">1. {item.namaPeserta}</div>
                                    <div className="text-slate-600">2. {item.anggota2}</div>
                                    <div className="text-slate-600">3. {item.anggota3}</div>
                                  </div>
                                )}
                              </td>
                              <td className="px-4 py-3 text-center">
                                <div className="flex items-center justify-center gap-2">
                                  <button
                                    onClick={() => setSelectedCard(item)}
                                    className="px-3 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold text-xs rounded-lg transition"
                                    title="Cetak Kartu Peserta"
                                  >
                                    🖨️ Kartu
                                  </button>
                                  <button
                                    onClick={() => handleDelete(item.id)}
                                    className="p-1.5 text-red-500 hover:bg-red-50 rounded-lg transition"
                                    title="Hapus Data"
                                  >
                                    🗑️
                                  </button>
                                </div>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: KATALOG LOMBA */}
            {activeTab === 'katalog' && (
              <div className="grid md:grid-cols-2 gap-6">
                {LOMBA_DATA.map((lomba) => (
                  <div key={lomba.kode} className="bg-white rounded-2xl p-6 shadow-sm border border-emerald-100 hover:shadow-md transition">
                    <div className="flex justify-between items-start mb-3">
                      <div>
                        <span className="text-xs font-mono font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                          KODE: {lomba.kode}
                        </span>
                        <h3 className="text-lg font-bold text-slate-800 mt-1">{lomba.nama}</h3>
                      </div>
                      <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${lomba.isKelompok ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}`}>
                        {lomba.isKelompok ? '👥 Kelompok (3 Orang)' : '👤 Perorangan'}
                      </span>
                    </div>

                    <p className="text-slate-600 text-sm mb-4">{lomba.deskripsi}</p>

                    <div className="border-t pt-3">
                      <p className="text-xs font-semibold text-slate-500 mb-2">Kategori Kelas Diizinkan:</p>
                      <div className="flex flex-wrap gap-1.5">
                        {lomba.allowedClasses.map(k => (
                          <span key={k} className="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded font-mono border">
                            {k}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal Cetak Kartu Peserta */}
          {selectedCard && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div id="printable-area" className="border-2 border-emerald-600 p-6 rounded-xl bg-gradient-to-br from-emerald-50 via-white to-amber-50 relative overflow-hidden">
                  <div className="text-center border-b border-emerald-200 pb-3 mb-4">
                    <h3 className="text-lg font-black text-emerald-900 tracking-wide uppercase">KARTU PESERTA LOMBA</h3>
                    <p className="text-xs font-bold text-amber-600">HARI SANTRI 2026</p>
                  </div>

                  <div className="space-y-3 text-sm">
                    <div className="flex justify-between border-b border-slate-100 pb-1">
                      <span className="text-slate-500 text-xs font-semibold">No. Registrasi</span>
                      <span className="font-mono font-bold text-emerald-800">{selectedCard.id}</span>
                    </div>
                    <div className="flex justify-between border-b border-slate-100 pb-1">
                      <span className="text-slate-500 text-xs font-semibold">Cabang Lomba</span>
                      <span className="font-bold text-slate-800">{selectedCard.namaLomba}</span>
                    </div>
                    <div className="flex justify-between border-b border-slate-100 pb-1">
                      <span className="text-slate-500 text-xs font-semibold">Kategori</span>
                      <span className="font-bold text-slate-800">Kelas {selectedCard.kelas}</span>
                    </div>

                    <div className="pt-2">
                      <span className="text-slate-500 text-xs font-semibold block mb-1">
                        {selectedCard.isKelompok ? 'Anggota Tim / Regu:' : 'Nama Peserta:'}
                      </span>
                      {!selectedCard.isKelompok ? (
                        <p className="text-base font-black text-slate-900 bg-emerald-100/50 p-2 rounded text-center border border-emerald-200">
                          {selectedCard.namaPeserta}
                        </p>
                      ) : (
                        <div className="bg-emerald-100/50 p-2.5 rounded border border-emerald-200 space-y-1 text-xs">
                          <p className="font-bold text-emerald-950">1. {selectedCard.namaPeserta}</p>
                          <p className="font-medium text-slate-800">2. {selectedCard.anggota2}</p>
                          <p className="font-medium text-slate-800">3. {selectedCard.anggota3}</p>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="mt-6 pt-3 border-t border-emerald-200 flex justify-between items-end text-[10px] text-slate-400">
                    <span>Panitia Hari Santri 2026</span>
                    <span>Tgl Cetak: {new Date().toLocaleDateString('id-ID')}</span>
                  </div>
                </div>

                <div className="flex gap-3 no-print">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow"
                  >
                    🖨️ Cetak / Save PDF
                  </button>
                  <button
                    onClick={() => setSelectedCard(null)}
                    className="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-sm"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-800 text-slate-400 py-4 text-center text-xs border-t border-slate-700 no-print">
            © 2026 Panitia Lomba Hari Santri. Powered by GitHub Pages & Google Apps Script.
          </footer>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
